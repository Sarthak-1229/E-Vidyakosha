name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Source traceability and tracked files
        run: python scripts/verify_repository.py --ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, contract and React component tests
        run: npm run test
      - name: MongoDB replica-set integration tests
        run: npm run test:integration -w @evidy/api
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser API tests
        run: npm run test:e2e -w @evidy/api
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev
